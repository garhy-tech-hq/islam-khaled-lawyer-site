name: Recover production snapshot

on:
  push:
    branches:
      - "recovery/production-sync-20260823"

permissions:
  contents: write

concurrency:
  group: recover-production-snapshot
  cancel-in-progress: false

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v4
        with:
          ref: recovery/production-sync-20260823
          fetch-depth: 0

      - name: Download exact production output
        shell: bash
        run: |
          set -euo pipefail
          base="https://islam-khaled-lawyer-site.vercel.app"
          rm -rf public
          mkdir -p public/assets

          fetch() {
            local path="$1"
            local output="$2"
            local tmp="${output}.tmp"
            curl --fail --location --silent --show-error --retry 3 --retry-delay 1 \
              --connect-timeout 15 --max-time 90 \
              "${base}${path}" -o "$tmp"
            test -s "$tmp"
            mv "$tmp" "$output"
          }

          fetch "/" "public/index.html"
          fetch "/styles.css" "public/styles.css"
          fetch "/theme-init.js" "public/theme-init.js"
          fetch "/app.js" "public/app.js"
          fetch "/sw.js" "public/sw.js"
          fetch "/manifest.webmanifest" "public/manifest.webmanifest"
          fetch "/assets/favicon-32.png" "public/assets/favicon-32.png"
          fetch "/assets/apple-touch-icon-180.png" "public/assets/apple-touch-icon-180.png"
          fetch "/assets/app-icon-192.png" "public/assets/app-icon-192.png"
          fetch "/assets/app-icon-512.png" "public/assets/app-icon-512.png"
          fetch "/assets/app-icon-maskable-512.png" "public/assets/app-icon-maskable-512.png"
          fetch "/assets/legal-emblem-512.webp" "public/assets/legal-emblem-512.webp"
          fetch "/assets/legal-emblem-768.webp" "public/assets/legal-emblem-768.webp"
          fetch "/assets/legal-emblem-1024.webp" "public/assets/legal-emblem-1024.webp"
          fetch "/assets/legal-emblem-1536.webp" "public/assets/legal-emblem-1536.webp"
          fetch "/assets/legal-emblem-1536.jpg" "public/assets/legal-emblem-1536.jpg"
          fetch "/assets/social-preview-v3-1200x630.jpg" "public/assets/social-preview-v3-1200x630.jpg"

      - name: Validate downloaded asset signatures
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pngs = [
              "favicon-32.png", "apple-touch-icon-180.png", "app-icon-192.png",
              "app-icon-512.png", "app-icon-maskable-512.png"
          ]
          jpgs = ["legal-emblem-1536.jpg", "social-preview-v3-1200x630.jpg"]
          webps = [
              "legal-emblem-512.webp", "legal-emblem-768.webp",
              "legal-emblem-1024.webp", "legal-emblem-1536.webp"
          ]
          root = Path("public/assets")
          for name in pngs:
              data = (root / name).read_bytes()
              assert data.startswith(b"\x89PNG\r\n\x1a\n"), f"Invalid PNG: {name}"
          for name in jpgs:
              data = (root / name).read_bytes()
              assert data.startswith(b"\xff\xd8\xff") and data.endswith(b"\xff\xd9"), f"Invalid JPEG: {name}"
          for name in webps:
              data = (root / name).read_bytes()
              assert data[:4] == b"RIFF" and data[8:12] == b"WEBP", f"Invalid WebP: {name}"
          print("Binary signatures verified.")
          PY

      - name: Run integrity QA and production build
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run build
          test -f .vercel/output/config.json
          diff -qr public .vercel/output/static

      - name: Record immutable snapshot checksums
        shell: bash
        run: |
          set -euo pipefail
          find public -type f -print0 | sort -z | xargs -0 sha256sum > PRODUCTION_SNAPSHOT_SHA256.txt

      - name: Commit recovered production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public PRODUCTION_SNAPSHOT_SHA256.txt
          if git diff --cached --quiet; then
            echo "Production snapshot already matches the recovery branch."
            exit 0
          fi
          git commit -m "chore: recover exact production snapshot"
          git push origin HEAD:recovery/production-sync-20260823
