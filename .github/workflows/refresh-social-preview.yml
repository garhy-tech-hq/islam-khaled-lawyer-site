name: Refresh social preview

on:
  push:
    paths:
      - '.github/workflows/refresh-social-preview.yml'

permissions:
  contents: write

jobs:
  refresh-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Open Graph metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://raw.githubusercontent.com/garhy-tech-hq/islam-khaled-lawyer-site/main/public/og-counselor-v5.jpg'
          new = 'https://garhy-tech-hq.github.io/islam-khaled-lawyer-site/public/og-preview-lawyer-v11.jpg'
          s = s.replace(old, new)
          s = s.replace('<meta property="og:image:width" content="400">', '<meta property="og:image:width" content="600">')
          s = s.replace('<meta property="og:image:height" content="400">', '<meta property="og:image:height" content="315">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit metadata update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No metadata changes needed.'
          else
            git commit -m 'Use final Open Graph preview image'
            git push
          fi
