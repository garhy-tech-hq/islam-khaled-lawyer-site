name: CI

on:
  push:
    branches:
      - main
      - "recovery/production-sync-20260823"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Integrity QA
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify build parity
        run: diff -qr public .vercel/output/static
